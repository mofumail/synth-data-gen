# Dataset bounds
ds_start: "2022-06-23"
ds_end:   "2022-12-08"

# Train / val / test splits
train_cutoff: "2022-11-15"
val_cutoff:   "2022-12-01"

# Sessionization
session_timeout_min: 30        # inactivity gap (minutes) that starts a new session
history_window:      16        # max past events used as cross-session context (covers 93.9% of users)

# Vocabulary
vocab_k: 630052                # top-K SKUs covering ~90% of training item events

# Temporal head
n_temporal_bins: 64            # log-spaced bins between temporal_min_s and session_timeout
temporal_min_s:  1             # minimum inter-event delta (seconds)

# Data loading
page_visit_sample: 200000000   # set > 199M to load all page_visits (original ~199M)

# MongoDB
mongo_uri: "mongodb://localhost:27017"
mongo_db:  "synerise"

# Training
train_epochs:       30
train_batch_size:   256
train_max_length:   50         # max events per session (including EOS)
train_lr:           0.0003     # AdamW learning rate
train_d_model:      128        # transformer hidden dimension
train_n_layers:     4          # number of decoder layers
train_n_heads:      4          # attention heads (must divide d_model)
train_max_sessions: null       # null = use all sessions; set int for smoke tests
train_num_workers:  4          # dataset is built in main process; workers only run __getitem__

# Category head (hierarchical mode)
category_rare_threshold: 5   # categories with <= this many SKUs are collapsed to RARE token, based on notbooks/cat_rare_treshhold.py
# This one doesn't really matter, SKu coverage numbers are tiny across the board, treshhold 50 only collapses 3.5% of SKUs
#

# SVD-PQ item tokenizer (offline: ingestion/svdpq.py)
svdpq_enabled:          true
svdpq_t:                4         # SVD dims -> tokens per item  ;;; Try : 2, 8, 4, 16
svdpq_v:                512         # bins per dim                 ;;; Try: ,2048 256, 512, 128
item_head_top_k:        100        # items kept from item head at inference (affects both ItemHead and SVDPQItemHead)

# Inference sampling temperatures
infer_temperature:      1.0        # action / category / temporal heads
infer_item_temperature: 15.0        # item head (SVD-PQ Hamming score or flat pool softmax)
svdpq_binning:          quantile   # quantile | uniform , quantile seems better; offers even bin sizes
svdpq_noise_std:        0.00001     # pre-bin Gaussian noise stddev (on [0,1]-scaled embs)
svdpq_min_interactions: 2          # below this -> category-centroid cold-start fallback, # based on : notebooks/interactions.py
# The knee is somewhere inbetween 1 - 2
# The jump from treshhold 1-2 is 27.3pp, to 29.8pp from 2-3


svdpq_event_weights:     # decided based on notebooks/tf-idf-weights.py, inverse frequency
  product_buy:        4.0321
  add_to_cart:        2.6985
  remove_from_cart:   3.7798
  page_visit:         0.2513
  search_query:       2.1683

# GRU4Rec downstream evaluator
gru4rec_embed_dim:   64
gru4rec_hidden_dim:  128
gru4rec_max_epochs:  30
gru4rec_batch_size:  16
gru4rec_vocab_k:     50000   # cap output vocab to top-K items by freq; prevents OOM with large Markov item pools
gru4rec_lr:          0.001
gru4rec_patience:    5
gru4rec_lr_patience: 3
gru4rec_val_split:   0.1
gru4rec_lr_factor:   0.5
