# Dataset bounds
ds_start: "2022-06-23"
ds_end:   "2022-12-08"

# Train / val / test splits
train_cutoff: "2022-11-15"
val_cutoff:   "2022-12-01"

# Sessionization
session_timeout_min: 30        # inactivity gap (minutes) that starts a new session
history_window:      16        # max past events used as cross-session context (H); coverage per H: thesis tab:history-window-coverage

# Vocabulary
vocab_k: 200000               # top-K item vocabulary cap

# Temporal head
n_temporal_bins: 64            # log-spaced bins between temporal_min_s and session_timeout
temporal_min_s:  1             # minimum inter-event delta (seconds)

# Data loading
page_visit_sample: 200000000   # set > 199M to load all page_visits (original ~199M)

# MongoDB
mongo_uri: "mongodb://localhost:27017"
mongo_db:  "synerise"

# Training
train_epochs:       50
train_batch_size:   256
train_max_length:   50         # max events per session (including EOS)
train_lr:           0.0003     # AdamW learning rate
train_d_model:      128        # transformer hidden dimension
train_n_layers:     4          # number of decoder layers
train_n_heads:      4          # attention heads (must divide d_model)
train_max_sessions: null       # null = use all sessions; set int for smoke tests
train_num_workers:  4          # dataset is built in main process; workers only run __getitem__
train_patience:     5          # epochs without val-loss improvement before early stop (probes instead if is_best_eval_enabled)

# Category head (hierarchical mode)
category_rare_threshold: 5   # categories with <= this many SKUs are collapsed to RARE token
# Sensitivity (notebooks/cat_rare_threshold.py): SKU coverage impact is tiny across the board; even threshold 50 collapses only 3.5% of SKUs.

# Item head iteration:
#   flat  - Iter 1 baseline: K-way softmax over full vocab, no category at all
#   hier  - Iter 2: hierarchical category -> in-category masked CE
#   svdpq - Iter 3: SVD product-quantized factored softmax
# `svdpq_enabled` below is kept as a back-compat alias and is auto-derived
# from this mode in config.py.
item_head_mode:         flat

# SVD-PQ item tokenizer (offline: ingestion/svdpq.py)
svdpq_enabled:          false
svdpq_t:                4         # SVD dims -> tokens per item  ;;; Try : 2, 8, 4, 16
svdpq_v:                512         # bins per dim                 ;;; Try: ,2048 256, 512, 128
svdpq_label_smoothing:  0.1       # per-dim CE label smoothing; caps per-token peakedness so the t-factor joint doesn't collapse to winner-take-all. 0.0 = off.

# Evaluation - folder name of the trained model to evaluate (under output/models/).
# Must include the training timestamp suffix, e.g.
#   session_transformer_d128_l4_h4_svdpq_t4v512_210426-15-58-18

#eval_model: session_transformer_d128_l4_h4_flat_070526-18-28-41_iter1_true
#eval_model: session_transformer_d128_l4_h4_hier_t4v512_280426-09-01-02_testing-baseline-200k
eval_model: session_transformer_d128_l4_h4_svdpq_t4v512_210526-12-12-18_iter3_svdpq_base_200k

# Inference sampling temperatures
infer_temperature:      1.0        # action / category / temporal heads
infer_item_temperature: 1.0     # item head (SVD-PQ Hamming score or flat pool softmax)
infer_pool_temperature: 1.0    # SVD-PQ in-pool softmax (log_prob scorer): smaller -> sharper pool pick

# SVD-PQ inference scorer: how to pick the final in-pool SKU from the t per-dim softmaxes.
#   hamming  : sample t tokens, rank pool SKUs by count of matching tokens (legacy)
#   log_prob : score each pool SKU by sum of log-probs of its t tokens under the head (true factored likelihood)
svdpq_infer_scorer:     log_prob  # hamming | log_prob
svdpq_binning:          quantile   # quantile | uniform , quantile seems better; offers even bin sizes
svdpq_noise_std:        0.00001     # pre-bin Gaussian noise stddev (on [0,1]-scaled embs)
svdpq_min_interactions: 2          # below this -> category-centroid cold-start fallback, # based on : notebooks/interactions.py

# The knee is somewhere inbetween 1 - 2
# The jump from treshhold 1-2 is 27.3pp, to 29.8pp from 2-3

svdpq_event_weights:     # decided based on notebooks/tf-idf-weights.py, inverse frequency, # calculate weights with lstm rf
  product_buy:        4.0321
  add_to_cart:        2.6985
  remove_from_cart:   3.7798
  page_visit:         0.2513
  search_query:       2.1683

# Multi-task loss head weighting. Scales each per-head CE before summing into
# the total loss the optimizer sees. enabled=false -> plain sum (legacy).
# loss_weights index map (must have exactly 4 entries):
#   [0] action_loss   - next-action CE over all real positions
#   [1] category_loss - next-category CE at item-bearing positions
#   [2] item_loss     - next-item   CE at item-bearing positions
#   [3] temporal_loss - next-delta-bin CE over all real positions
# Item CE is ~12 nats (200K classes) vs ~1-5 for the others, so the unweighted
# sum is item-dominated. Down-weighting [2] / up-weighting [0,1,3] gives the
# other heads more gradient budget without changing is_best (which is TSTR HR).
loss_weights_enabled: false
loss_weights:        [1.0, 1.0, 1.0, 1.0]

# Popularity-bias mitigation (train-time only; inference path untouched).
# A : per-event inverse-frequency weighting on the item CE loss.
#     w_sku = (count + 1) ** -alpha, normalized so E_data[w] = 1.
#     0.0 = off (loss identical to vanilla CE).  Try 0.5 - 0.75.
# B : Menon et al. 2021 logit adjustment on the category CE loss.
#     train_logits = raw_logits + tau * log(category_prior).
#     0.0 = off.  1.0 = Bayes-optimal correction for class imbalance.
item_loss_freq_weight_alpha: 0.0 # 0.5
cat_logit_adj_tau:           0.0 # 1.0

# In-training TSTR-T probe (drives is_best checkpoint selection).
# When enabled, every is_best_eval_every_n_epochs the model is frozen,
# n synthetic sessions are generated per seed, GRU4Rec is fit on each
# and evaluated on the real val split. Mean HR@K across seeds replaces
# val_loss as the is_best signal. Disabled -> falls back to val_loss.
is_best_eval_enabled:        false
is_best_eval_every_n_epochs: 5
is_best_eval_n_sessions:     200000
is_best_eval_seeds:          [42, 43, 44]
is_best_eval_k:              10

# Final-evaluation scale (consumed by evaluate.py once training is done).
final_eval_n_sessions: 500000
final_eval_seeds:      [42, 43, 44, 45, 46]

# GRU4Rec downstream evaluator
gru4rec_embed_dim:   64
gru4rec_hidden_dim:  128
gru4rec_max_epochs:  30
gru4rec_batch_size:  16
gru4rec_vocab_k:     200000   # cap output vocab to top-K items by freq; prevents OOM with large Markov item pools
gru4rec_lr:          0.001
gru4rec_patience:    5
gru4rec_lr_patience: 3
gru4rec_val_split:   0.1
gru4rec_lr_factor:   0.5
